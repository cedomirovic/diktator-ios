name: DiktatorIOS

options:
  bundleIdPrefix: com.cedomirovic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_LANGUAGE: sr
    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: LHQ4Q44425
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"

targets:
  DiktatorIOS:
    type: application
    platform: iOS
    sources:
      - path: DiktatorIOS
    info:
      path: DiktatorIOS/Info.plist
      properties:
        CFBundleDisplayName: Diktator
        CFBundleName: Diktator
        CFBundleShortVersionString: "0.1.6"
        CFBundleVersion: "7"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Diktator koristi mikrofon za diktat i, kada uključiš sesiju, drži ga u pripravnosti do 15 minuta. Snimak ostaje na uređaju."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Diktator koristi lokalnu mrežu samo ako izabereš Ollama ili lokalni LLM servis."
        CFBundleURLTypes:
          - CFBundleURLName: com.cedomirovic.diktator.ios
            CFBundleURLSchemes:
              - diktator-ios
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedomirovic.diktator.ios
        INFOPLIST_FILE: DiktatorIOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_OBJC_BRIDGING_HEADER: DiktatorIOS/DiktatorIOS-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/vendor-ios/whisper/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/vendor-ios/whisper/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-force_load"
          - "$(SRCROOT)/vendor-ios/whisper/lib/libggml-metal.a"
          - "-force_load"
          - "$(SRCROOT)/vendor-ios/whisper/lib/libggml-cpu.a"
          - "-force_load"
          - "$(SRCROOT)/vendor-ios/whisper/lib/libggml-blas.a"
          - "$(SRCROOT)/vendor-ios/whisper/lib/libwhisper.a"
          - "$(SRCROOT)/vendor-ios/whisper/lib/libggml.a"
          - "$(SRCROOT)/vendor-ios/whisper/lib/libggml-base.a"
          - "-framework"
          - "Metal"
          - "-framework"
          - "MetalKit"
          - "-framework"
          - "Accelerate"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "UIKit"
          - "-lc++"
    dependencies:
      - target: DiktatorKeyboard
        embed: true

  DiktatorKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: DiktatorKeyboard
    info:
      path: DiktatorKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Diktator
        CFBundleName: Diktator
        CFBundleShortVersionString: "0.1.6"
        CFBundleVersion: "7"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: sr
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedomirovic.diktator.ios.keyboard
        INFOPLIST_FILE: DiktatorKeyboard/Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  DiktatorIOS:
    build:
      targets:
        DiktatorIOS: all
        DiktatorKeyboard: all
    run:
      config: Debug
    archive:
      config: Release
