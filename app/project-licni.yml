name: DiktatorLicni

# Privremena kopija pravog projekta sa drugim bundle ID-jevima, da bi se
# besplatnim timom (Hobby) mogla napraviti instalacija preko mreže. Pravi
# bundle ID `com.cedomirovic.diktator.ios` pripada plaćenom timu, pa ga
# besplatni tim ne može registrovati.
#
#   cd build/licni && xcodegen generate
#   xcodebuild -project DiktatorLicni.xcodeproj -scheme DiktatorLicni ...
#
# Izvori su isti kao u `app/`, a `Info.plist` se pravi ovde da se ne bi
# pregazio pravi.

options:
  bundleIdPrefix: com.cedomirovic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "10"
    DEVELOPMENT_TEAM: LHQ4Q44425
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    SWIFT_EMIT_LOC_STRINGS: YES
    # Projekat živi u `build/licni`, a izvori i whisper biblioteke u `app/`.
    IZVORI: "$(SRCROOT)/../../app"

targets:
  DiktatorLicni:
    type: application
    platform: iOS
    sources:
      - path: ../../app/DiktatorIOS
        excludes:
          - Info.plist
    info:
      path: InfoLicni.plist
      properties:
        CFBundleDisplayName: Diktator Lični
        CFBundleName: Diktator Licni
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "10"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Diktator koristi mikrofon da pretvori tvoj govor u tekst. Dok je sesija uključena, mikrofon je u pripravnosti da bi tastatura mogla da diktira u drugim aplikacijama. Snimak se obrađuje na uređaju i ne čuva se."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Diktator koristi lokalnu mrežu samo ako izabereš Ollama ili lokalni LLM servis."
        CFBundleURLTypes:
          - CFBundleURLName: com.cedomirovic.diktator.ios.licni
            CFBundleURLSchemes:
              - diktator-ios
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedomirovic.diktator.ios.licni
        INFOPLIST_FILE: InfoLicni.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_OBJC_BRIDGING_HEADER: "$(IZVORI)/DiktatorIOS/DiktatorIOS-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(IZVORI)/vendor-ios/whisper/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(IZVORI)/vendor-ios/whisper/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-force_load"
          - "$(IZVORI)/vendor-ios/whisper/lib/libggml-metal.a"
          - "-force_load"
          - "$(IZVORI)/vendor-ios/whisper/lib/libggml-cpu.a"
          - "-force_load"
          - "$(IZVORI)/vendor-ios/whisper/lib/libggml-blas.a"
          - "-force_load"
          - "$(IZVORI)/vendor-ios/whisper/lib/libwhisper.a"
          - "-force_load"
          - "$(IZVORI)/vendor-ios/whisper/lib/libggml.a"
          - "-force_load"
          - "$(IZVORI)/vendor-ios/whisper/lib/libggml-base.a"
          - "-framework"
          - "Metal"
          - "-framework"
          - "MetalKit"
          - "-framework"
          - "Accelerate"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "UIKit"
          - "-lc++"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(IZVORI)/vendor-ios/whisper-sim/lib"
        "OTHER_LDFLAGS[sdk=iphonesimulator*]":
          - "-force_load"
          - "$(IZVORI)/vendor-ios/whisper-sim/lib/libggml-cpu.a"
          - "-force_load"
          - "$(IZVORI)/vendor-ios/whisper-sim/lib/libggml-blas.a"
          - "-force_load"
          - "$(IZVORI)/vendor-ios/whisper-sim/lib/libwhisper.a"
          - "-force_load"
          - "$(IZVORI)/vendor-ios/whisper-sim/lib/libggml.a"
          - "-force_load"
          - "$(IZVORI)/vendor-ios/whisper-sim/lib/libggml-base.a"
          - "-framework"
          - "Accelerate"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "UIKit"
          - "-lc++"
    dependencies:
      - target: DiktatorKeyboardLicni
        embed: true

  DiktatorKeyboardLicni:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../app/DiktatorKeyboard
        excludes:
          - Info.plist
    info:
      path: InfoTastaturaLicni.plist
      properties:
        CFBundleDisplayName: Diktator Lični
        CFBundleName: Diktator Licni
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "10"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: sr
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedomirovic.diktator.ios.licni.keyboard
        INFOPLIST_FILE: InfoTastaturaLicni.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  DiktatorLicni:
    build:
      targets:
        DiktatorLicni: all
        DiktatorKeyboardLicni: all
    run:
      config: Debug
    archive:
      config: Release
